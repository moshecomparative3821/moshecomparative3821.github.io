<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>纯背景 · 仅图片</title>
  <style>
    /* === 全局重置：只保留背景，无任何额外元素 === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      /* 背景图片：使用与原来相同的示例图片 */
      background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZrIlqimvLuWJ2rLTqJ60yWkBSfQIGsQACcicAAkreUVS3acnz8W7Itj0E.png');
      
      /* 背景不重复 */
      background-repeat: no-repeat;
      
      /* 背景覆盖整个视口，保持比例，可能会裁剪 */
      background-size: cover;
      
      /* 背景固定，滚动时背景不动（可选） */
      background-attachment: fixed;
      
      /* 背景位置居中 */
      background-position: center center;
      
      /* 完全透明、无任何文字或装饰 */
      color: transparent;
      background-color: transparent;
      
      /* 确保没有任何内边距或外边距干扰 */
      padding: 0;
      margin: 0;
    }

    /* 移除所有可能的内容容器 — 不留任何可见元素 */
    /* 没有任何 .instruction-card, h1, p, ul, li, code, .btn-style 等 */
    /* 甚至 body 的 display: flex 也去掉，让背景自然铺满 */
    body {
      display: block;      /* 重置为 block，不干扰背景 */
      align-items: normal;
      justify-content: normal;
    }

    /* 完全隐藏任何可能存在的脚本或额外内容（但本页面没有任何内容） */
    /* 保留 script 但不影响视觉 — 已无任何 DOM 元素 */
  </style>
</head>
<body>
  <!-- 空 body：没有任何文字、卡片、按钮、列表、标题 -->
  <!-- 只有背景图片通过 CSS 显示 -->
  <!-- 删除所有之前的 instruction-card、h1、p、ul、按钮等 -->
  <!-- 没有任何可见内容，只有纯粹背景 -->
  
  <!-- 极简脚本：仅用于控制台提示，不影响视觉，可保留或删除 -->
  <script>
    // 此脚本仅向控制台输出一条信息，完全不影响背景显示。
    // 如果希望彻底无任何脚本，可以删除此 <script> 块。
    console.log('✨ 当前页面仅保留背景图片，所有文字、卡片、按钮均已移除。');
  </script>
</body>
</html>
