    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZrIlqimvLuWJ2rLTqJ60yWkBSfQIGsQACcicAAkreUVS3acnz8W7Itj0E.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* 卡片容器 */
        .brand-card {
            background-color: rgba(20, 20, 30, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 2.2rem 3rem;
            border-radius: 32px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            transition: all 0.2s;
        }

        /* 北门NB 大字 */
        h1 {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: 4px 4px 16px rgba(0, 0, 0, 0.85);
            word-break: keep-all;
            margin: 0 0 0.6rem 0;
        }

        .sub {
            font-size: 0.9rem;
            letter-spacing: 6px;
            opacity: 0.7;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 1rem;
        }

        /* 按钮组（原样保留，仅微调间距） */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
            margin-bottom: 1.8rem;
            /* 与游戏区拉开距离 */
        }

        .btn {
            flex: 1 1 180px;
            min-width: 140px;
            padding: 0.9rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .btn-nekobounce {
            background: rgba(100, 180, 255, 0.20);
            border-color: rgba(100, 180, 255, 0.35);
        }
        .btn-nekobounce:hover {
            background: rgba(100, 180, 255, 0.32);
            border-color: rgba(100, 200, 255, 0.6);
        }

        .btn-涩涩 {
            background: rgba(255, 120, 180, 0.20);
            border-color: rgba(255, 120, 180, 0.35);
        }
        .btn-涩涩:hover {
            background: rgba(255, 120, 180, 0.32);
            border-color: rgba(255, 150, 200, 0.6);
        }

        /* ========= 猫娘互动游戏区 ========= */
        .game-area {
            margin-top: 0.8rem;
            padding: 1.2rem 1rem;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: all 0.2s;
            user-select: none;
        }

        .game-area .cat-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.4rem 0;
        }

        .cat-avatar {
            font-size: 4.8rem;
            line-height: 1.2;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .cat-avatar:hover {
            transform: scale(1.08) rotate(-4deg);
        }

        .cat-avatar:active {
            transform: scale(0.92) rotate(2deg);
        }

        .cat-speech {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            color: #fff6e8;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            margin: 0 auto;
        }

        /* 点击提示小字 */
        .cat-hint {
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 2px;
            margin-top: 0.2rem;
        }

        /* 移动端适配 */
        @media (max-width: 550px) {
            h1 {
                font-size: 3.8rem;
                letter-spacing: 3px;
            }
            .brand-card {
                padding: 1.8rem 1.5rem;
            }
            .btn {
                font-size: 1.1rem;
                padding: 0.75rem 1rem;
                min-width: 120px;
                flex: 1 1 140px;
            }
            .sub {
                font-size: 0.75rem;
                letter-spacing: 4px;
            }
            .cat-avatar {
                font-size: 3.8rem;
            }
            .cat-speech {
                font-size: 1rem;
                padding: 0.4rem 1.2rem;
                min-height: 2.8rem;
            }
            .game-area {
                padding: 1rem 0.8rem;
            }
        }

        @media (max-width: 400px) {
            .button-group {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                flex: 1 1 auto;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="brand-card">
        <h1>北门NB</h1>
        <div class="sub">✦ 不止于北门 ✦</div>

        <!-- 按钮组（完全保留原样） -->
        <div class="button-group">
            <a href="https://nekobounce.qzz.io/" target="_blank" rel="noopener noreferrer" class="btn btn-nekobounce">
                🐾 nekobounce
            </a>
            <a href="https://www.pixiv.net/users/104419511" target="_blank" rel="noopener noreferrer" class="btn btn-涩涩">
                ✦ 涩涩
            </a>
        </div>

        <!-- ===== 猫娘互动游戏 ===== -->
        <div class="game-area" id="gameArea">
            <div class="cat-container" id="catContainer">
                <div class="cat-avatar" id="catAvatar">😺</div>
                <div class="cat-speech" id="catSpeech">戳戳我～</div>
                <div class="cat-hint">✦ 点击猫娘互动 ✦</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // 猫娘台词库（可自由扩充）
            const speeches = [
                "喵～ 你好呀！",
                "今天也元气满满！",
                "最喜欢你啦 ❤️",
                "要一起玩吗？",
                "摸摸头～ (´▽`ʃ♡)ƪ",
                "北门最棒了！",
                "嘿嘿，好开心～",
                "给你小鱼干 🐟",
                "晚上好喵～",
                "我超可爱的！",
                "抱抱～ (*≧▽≦)",
                "你点我干嘛啦 >_<",
                "再点我就要生气了！",
                "骗你的，我才不生气呢",
                "一起去看星星吧 ✨",
                "喵喵喵～",
                "今天的月亮好圆",
                "要听我唱歌吗？",
                "我是你的猫娘哦",
                "最喜欢这个网页了！"
            ];

            // DOM 元素
            const avatar = document.getElementById('catAvatar');
            const speech = document.getElementById('catSpeech');
            const container = document.getElementById('catContainer');

            // 当前状态（用于表情切换）
            let emojiState = 0;
            const emojis = ['😺', '😸', '😻', '😽', '🙀', '😹', '🐱', '😼'];

            // 随机获取一句台词
            function getRandomSpeech() {
                return speeches[Math.floor(Math.random() * speeches.length)];
            }

            // 切换表情（轮换）
            function nextEmoji() {
                emojiState = (emojiState + 1) % emojis.length;
                return emojis[emojiState];
            }

            // 互动响应
            function interact() {
                // 更换表情
                avatar.textContent = nextEmoji();

                // 随机台词
                speech.textContent = getRandomSpeech();

                // 添加一个小动画（弹跳感）
                avatar.style.transition = 'transform 0.1s';
                avatar.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    avatar.style.transform = 'scale(1)';
                }, 100);

                // 微弱的语音气泡闪烁
                speech.style.transition = 'background 0.15s';
                speech.style.background = 'rgba(255, 200, 150, 0.3)';
                setTimeout(() => {
                    speech.style.background = 'rgba(0, 0, 0, 0.25)';
                }, 200);
            }

            // 绑定点击事件（整个容器点击触发）
            container.addEventListener('click', interact);

            // 触摸设备兼容（防止双击缩放干扰）
            container.addEventListener('touchstart', function(e) {
                // 不阻止默认，仅触发互动
                interact();
            }, { passive: true });

            console.log('🐱 猫娘互动已加载，欢迎戳戳！');
        })();
    </script>
</body>
</html>
