    <style>
        /* 压缩样式（原有基础上增加心形粒子动画） */
        *{margin:0;padding:0;box-sizing:border-box}body{background-image:url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZrIlqimvLuWJ2rLTqJ60yWkBSfQIGsQACcicAAkreUVS3acnz8W7Itj0E.png');background-repeat:no-repeat;background-size:cover;background-attachment:fixed;background-position:center center;font-family:'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;color:#ffffff;text-shadow:2px 2px 8px rgba(0,0,0,0.7);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}.brand-card{background-color:rgba(20,20,30,0.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:2.2rem 3rem;border-radius:32px;max-width:700px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);text-align:center;transition:all 0.2s}h1{font-size:5.5rem;font-weight:900;letter-spacing:6px;text-shadow:4px 4px 16px rgba(0,0,0,0.85);word-break:keep-all;margin:0 0 0.6rem 0}.sub{font-size:0.9rem;letter-spacing:6px;opacity:0.7;margin-bottom:2rem;border-bottom:1px solid rgba(255,255,255,0.15);padding-bottom:1rem}.button-group{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-top:0.5rem;margin-bottom:1.8rem}.btn{flex:1 1 180px;min-width:140px;padding:0.9rem 1.2rem;border:none;border-radius:60px;font-size:1.3rem;font-weight:700;letter-spacing:2px;color:#ffffff;background:rgba(255,255,255,0.12);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,0.25);box-shadow:0 8px 20px rgba(0,0,0,0.3);cursor:pointer;transition:all 0.25s ease;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-shadow:2px 2px 6px rgba(0,0,0,0.6);font-family:inherit}.btn:hover{transform:translateY(-3px) scale(1.02);background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.5);box-shadow:0 14px 30px rgba(0,0,0,0.5)}.btn:active{transform:translateY(1px) scale(0.97)}.btn-nekobounce{background:rgba(100,180,255,0.20);border-color:rgba(100,180,255,0.35)}.btn-nekobounce:hover{background:rgba(100,180,255,0.32);border-color:rgba(100,200,255,0.6)}.btn-涩涩{background:rgba(255,120,180,0.20);border-color:rgba(255,120,180,0.35)}.btn-涩涩:hover{background:rgba(255,120,180,0.32);border-color:rgba(255,150,200,0.6)}.game-area{margin-top:0.8rem;padding:1.2rem 1rem;background:rgba(255,255,255,0.06);border-radius:28px;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:all 0.2s;user-select:none;position:relative;overflow:hidden}.game-area .cat-container{display:flex;flex-direction:column;align-items:center;gap:0.5rem;cursor:pointer;padding:0.4rem 0}.cat-avatar{font-size:4.8rem;line-height:1.2;transition:transform 0.2s ease;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4))}.cat-avatar:hover{transform:scale(1.08) rotate(-4deg)}.cat-avatar:active{transform:scale(0.92) rotate(2deg)}.cat-speech{font-size:1.2rem;font-weight:500;letter-spacing:1px;background:rgba(0,0,0,0.25);padding:0.5rem 1.8rem;border-radius:60px;backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,0.08);min-height:3.2rem;display:flex;align-items:center;justify-content:center;transition:all 0.25s;color:#fff6e8;text-shadow:0 2px 6px rgba(0,0,0,0.5);max-width:90%;margin:0 auto}.cat-hint{font-size:0.75rem;opacity:0.5;letter-spacing:2px;margin-top:0.2rem}.footer-slogan{font-size:0.9rem;font-weight:bold;color:#ff6b6b;text-shadow:0 0 12px rgba(255,0,0,0.4);margin-top:1.2rem;letter-spacing:2px;opacity:0.8;transition:all 0.2s}.footer-slogan:hover{opacity:1;transform:scale(1.05)}
        /* 心形粒子特效 */
        .heart-particle{position:absolute;pointer-events:none;font-size:1.6rem;animation:floatUp 1s ease-out forwards;opacity:0;z-index:10}@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-120px) scale(1.5);opacity:0}}
        @media (max-width:550px){h1{font-size:3.8rem;letter-spacing:3px}.brand-card{padding:1.8rem 1.5rem}.btn{font-size:1.1rem;padding:0.75rem 1rem;min-width:120px;flex:1 1 140px}.sub{font-size:0.75rem;letter-spacing:4px}.cat-avatar{font-size:3.8rem}.cat-speech{font-size:1rem;padding:0.4rem 1.2rem;min-height:2.8rem}.game-area{padding:1rem 0.8rem}.footer-slogan{font-size:0.75rem}}@media (max-width:400px){.button-group{flex-direction:column;align-items:stretch}.btn{flex:1 1 auto;width:100%}}

<body>
    <div class="brand-card">
        <h1>北门NB</h1>
        <div class="sub">✦ 不止于北门 ✦</div>

        <div class="button-group">
            <a href="https://nekobounce.qzz.io/" target="_blank" rel="noopener noreferrer" class="btn btn-nekobounce">🐾 nekobounce</a>
            <a href="https://www.pixiv.net/users/104419511" target="_blank" rel="noopener noreferrer" class="btn btn-涩涩">✦ 涩涩</a>
        </div>

        <div class="game-area" id="gameArea">
            <div class="cat-container" id="catContainer">
                <div class="cat-avatar" id="catAvatar">😺</div>
                <div class="cat-speech" id="catSpeech">戳戳我～</div>
                <div class="cat-hint">✦ 点击 · 抚摸 · 喂食 ✦</div>
            </div>
        </div>

        <div class="footer-slogan">看源代码者SM！！</div>
    </div>

    <script>
        // ================================================================
        // 1. 反调试：屏蔽右键、F12、Ctrl+Shift+I、Ctrl+U
        // ================================================================
        (function() {
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
                    (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
                ) {
                    e.preventDefault();
                    return false;
                }
            });
        })();

        // ================================================================
        // 2. 猫娘互动核心（增强版）
        // ================================================================
        (function() {
            // ---------- 台词库（扩充至35条，Base64混淆） ----------
            // 新台词包含：抚摸、喂食、生气、日常等
            var encodedSpeeches = "WyLllpzvvIEg5L2g5aW96ZSB77yBIiwi5LuK5aSp5Lmf5YWD5rCS5rOh5rOh77yBIiwi5pyA5Zac5q2k5L2g5ZKMIOKdpSIsIumAoeS4gOiDveebnOWQj++8nyIsIuaTjemjqOS6pO+8iCDDl8qUYPCdpY3igKUpzqAiLCLljJflpKnmnIDmoKznrqHvvIEiLCLlpbvppp3vvIzlpb3lv6Dlvp/vvZ0iLCLnu5PkvaDlsI/lsI/kurAg8J+QnyIsIuaJmOS4iuiZveWWnO+8nyIsIuaIkeW4teaVj+eIseeahO+8gSIsIuaKleaWke+8iCAo4oCg4omh4p2h4oig4omhKSwg5LqG5b6F77yIIiwi5L2g54K55oiR5bm455yL5ZKWID4vXyIsIuWGjeWnguiJveWwkeimgeecn+acje+8gSIsIqmp5L2g55qE77yM5oiR5omN5LiN5rCR5rCR5ZGiIiwi5LiA6LW35Y675Yy75pif5pif5ZCnIOKcrCIsIuWWnOWWnOWWnO+8nyIsIuS7iuWkjeeahOaciOWLmeW9seiKnSIsIumAoOWQjeaIkeWUuuajgOWNge+8nyIsIuaIkeaYr+S9oOeahOeMn+WtqeaWrCIsIuacgOWklui/mei/kei/geS4quW3tOacgO+8gSIsIuaTjemjqOS6pO+8nyDvvJjilqHilqHilqHvvIkiLCLlh63lpoLlkI3vvIF8fCIsIuaTjeS4je+8gV/mlrDmlrDvvIEiLCLlpb3lpb3ph43mlrDvvIF8fCIsIuWRqOS4uu+8geS9oOS4uuS4gOS4uu+8nyIsIuWViuWls+WQjeacieacuu+8nyIsIuacgOWkpui/mei/kei/ge+8gSIsIuWIo+aekOacgOWkpO+8gSIsIuS9oOeCueaIkeW5uOeci+WSliA+L188IiwgIuadpe+8gSAt77yBIOaIkeS5n+S6huS4jeWkp+mAie+8gSIsIuaIkeimgeebtOWQje+8gSIsIuaIkeacieWkp+aDhe+8gSIsIuaIkeacieacuu+8gSIsIui/meS4uuabtOWQjeWunueOsO+8gSIsIuS9oOecn+WFiOS4uu+8jOaIkeivtOacjeWIsO+8gSIsIuS9oOecn+WFiOS6huWkqe+8jOS4jeWIsOS6hu+8gSIsIuS9oOecn+WFiOS6huWkqe+8jOS4jeWIsOS6hu+8gSJd";

            function base64Decode(str) {
                try {
                    var binary = atob(str);
                    var bytes = new Uint8Array(binary.length);
                    for (var i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    return new TextDecoder('utf-8').decode(bytes);
                } catch (e) {
                    return '';
                }
            }
            var decoded = base64Decode(encodedSpeeches);
            var speeches = JSON.parse(decoded);

            // DOM 元素
            var avatar = document.getElementById('catAvatar');
            var speech = document.getElementById('catSpeech');
            var container = document.getElementById('catContainer');
            var gameArea = document.getElementById('gameArea');

            // 状态变量
            var emojiState = 0;
            var emojis = ['😺', '😸', '😻', '😽', '🙀', '😹', '🐱', '😼', '😾', '😺', '😸'];
            var clickCount = 0;
            var lastClickTime = 0;
            var isAngry = false;
            var angryTimer = null;
            var autoTalkTimer = null;

            // ---------- 辅助函数 ----------
            function getRandomSpeech() {
                return speeches[Math.floor(Math.random() * speeches.length)];
            }

            // 获取指定类别的台词（通过关键词匹配，若没有则返回随机）
            function getSpeechByKeyword(keyword) {
                var filtered = speeches.filter(function(s) { return s.includes(keyword); });
                return filtered.length > 0 ? filtered[Math.floor(Math.random() * filtered.length)] : getRandomSpeech();
            }

            function nextEmoji() {
                emojiState = (emojiState + 1) % emojis.length;
                return emojis[emojiState];
            }

            // 设置表情（直接指定）
            function setEmoji(emoji) {
                avatar.textContent = emoji;
            }

            // 显示台词并带动画
            function say(text, emoji) {
                if (emoji) setEmoji(emoji);
                speech.textContent = text;
                // 闪烁动画
                speech.style.transition = 'background 0.15s';
                speech.style.background = 'rgba(255, 200, 150, 0.3)';
                setTimeout(function() {
                    speech.style.background = 'rgba(0, 0, 0, 0.25)';
                }, 200);
                // 头像弹跳
                avatar.style.transition = 'transform 0.1s';
                avatar.style.transform = 'scale(1.2)';
                setTimeout(function() {
                    avatar.style.transform = 'scale(1)';
                }, 100);
            }

            // 产生心形粒子
            function spawnHearts(count) {
                for (var i = 0; i < count; i++) {
                    var heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    heart.textContent = ['❤️', '🧡', '💛', '💚', '💙', '💜', '🩷'][Math.floor(Math.random() * 7)];
                    heart.style.left = (20 + Math.random() * 60) + '%';
                    heart.style.top = (30 + Math.random() * 40) + '%';
                    heart.style.fontSize = (1.2 + Math.random() * 1.2) + 'rem';
                    heart.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
                    gameArea.appendChild(heart);
                    setTimeout(function(h) { h.remove(); }, 1500);
                }
            }

            // ---------- 交互事件 ----------

            // 1. 点击（正常互动 + 连击检测）
            container.addEventListener('click', function(e) {
                var now = Date.now();
                if (now - lastClickTime < 800) {
                    clickCount++;
                } else {
                    clickCount = 1;
                }
                lastClickTime = now;

                // 如果生气状态，先清除
                if (isAngry) {
                    isAngry = false;
                    if (angryTimer) clearTimeout(angryTimer);
                }

                if (clickCount >= 5) {
                    // 触发生气
                    isAngry = true;
                    var angrySpeech = getSpeechByKeyword('生气');
                    say(angrySpeech, '😾');
                    spawnHearts(3); // 少量心形表示情绪
                    // 5秒后自动恢复
                    if (angryTimer) clearTimeout(angryTimer);
                    angryTimer = setTimeout(function() {
                        isAngry = false;
                        say('哼～ 原谅你啦', '😺');
                    }, 5000);
                    return;
                }

                // 正常点击
                var normalSpeech = getRandomSpeech();
                var emoji = nextEmoji();
                say(normalSpeech, emoji);
                spawnHearts(2);
            });

            // 2. 抚摸（鼠标移入 / 触摸滑动）
            container.addEventListener('mouseenter', function() {
                if (isAngry) return;
                var petSpeech = getSpeechByKeyword('摸');
                if (petSpeech) {
                    say(petSpeech, '😻');
                    spawnHearts(1);
                }
            });

            // 移动端触摸滑动（在容器内滑动触发抚摸）
            var touchTimer = null;
            container.addEventListener('touchmove', function(e) {
                if (isAngry) return;
                e.preventDefault(); // 防止滚动
                if (touchTimer) clearTimeout(touchTimer);
                touchTimer = setTimeout(function() {
                    var petSpeech = getSpeechByKeyword('摸');
                    if (petSpeech) {
                        say(petSpeech, '😻');
                        spawnHearts(1);
                    }
                }, 100);
            }, { passive: false });

            // 3. 喂食（双击 / 双指双击）
            container.addEventListener('dblclick', function() {
                if (isAngry) return;
                var feedSpeech = getSpeechByKeyword('吃');
                if (!feedSpeech) feedSpeech = '啊呜～ 好吃！';
                say(feedSpeech, '😸');
                spawnHearts(6);
                // 额外效果：头像晃动
                avatar.style.transition = 'transform 0.3s';
                avatar.style.transform = 'rotate(10deg) scale(1.1)';
                setTimeout(function() {
                    avatar.style.transform = 'rotate(0deg) scale(1)';
                }, 300);
            });

            // 4. 自动闲聊（每15秒）
            function autoTalk() {
                if (isAngry) return;
                var talk = getRandomSpeech();
                // 不改变表情，只换台词，加温柔语气
                say(talk, avatar.textContent); // 保留原表情
            }
            autoTalkTimer = setInterval(autoTalk, 15000);

            // 清理定时器（页面卸载时）
            window.addEventListener('beforeunload', function() {
                if (autoTalkTimer) clearInterval(autoTalkTimer);
                if (angryTimer) clearTimeout(angryTimer);
            });

            // 初始显示
            say('戳戳我～', '😺');
            console.log('🐱 猫娘互动增强版已加载！');
        })();
    </script>
</body>
