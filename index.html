<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>北门NB</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 背景图片（保留原图） */
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEZrIlqimvLuWJ2rLTqJ60yWkBSfQIGsQACcicAAkreUVS3acnz8W7Itj0E.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;

            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* 仅保留文字卡片，半透明衬底让大字更清晰 */
        .brand-card {
            background-color: rgba(20, 20, 30, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 2.2rem 3rem;
            border-radius: 32px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        /* 北门NB 四个大字 */
        h1 {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: 4px 4px 16px rgba(0, 0, 0, 0.85);
            word-break: keep-all;
            margin: 0;
        }

        /* 移动端适配 */
        @media (max-width: 550px) {
            h1 {
                font-size: 3.8rem;
                letter-spacing: 3px;
            }
            .brand-card {
                padding: 1.8rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="brand-card">
        <h1>北门NB</h1>
    </div>
</body>
</html>
